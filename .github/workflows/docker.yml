name: CI - Build & Push Docker Image

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/minidrive-docker .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/minidrive-docker
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.EC2_SSH_KEY }}
         script: |
           sudo docker pull rameshbabuvv/minidrive-docker
           sudo docker stop minidrive || true
           sudo docker rm minidrive || true
           docker run -d -p 5000:5000 --name minidrive rameshbabuvv/minidrive-docker