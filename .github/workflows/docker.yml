name: CI - Build & Deploy Docker

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/minidrive-docker:latest .

      # 4. Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/minidrive-docker:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          debug: true
          script: |
            echo "Connected successfully"

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/minidrive-docker:latest

            # Stop & remove old containers
            docker stop app1 || true
            docker rm app1 || true
            docker stop app2 || true
            docker rm app2 || true

            # Run app1
            docker run -d -p 5000:5000 --name app1 \
              ${{ secrets.DOCKER_USERNAME }}/minidrive-docker:latest python App.py

            # Run app2
            docker run -d -p 5001:5000 --name app2 \
              ${{ secrets.DOCKER_USERNAME }}/minidrive-docker:latest python App2.py