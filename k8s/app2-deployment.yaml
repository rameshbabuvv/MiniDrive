apiVersion: apps/v1
kind: Deployment

metadata:
  name: app2-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app2

  template:
    metadata:
      labels:
        app: app2

    spec:
      containers:
        - name: app2
          image: rameshbabuvv/minidrive-docker:latest

          ports:
            - containerPort: 5000

          command: ["python", "App2.py"]